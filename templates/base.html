<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102a43">
    <title>{% block title %}GUDLFT Registration{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="bg-body-tertiary">
    <header class="site-header navbar navbar-expand">
        <div class="container">
            <a class="brand navbar-brand" href="{{ url_for('dashboard') if session.get('club_email') else url_for('index') }}" aria-label="GUDLFT home">
                <span class="brand-mark" aria-hidden="true">G</span>
                <span>GUDLFT <span class="brand-light">CLUB PORTAL</span></span>
            </a>
            {% block header_action %}{% endblock %}
        </div>
    </header>
    <main class="page-shell container py-5">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash-list" role="status" aria-live="polite">
                    {% for message in messages %}<p class="flash-message alert alert-warning mb-2">{{ message }}</p>{% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer container">GUDLFT · Club registration portal</footer>
</body>
</html>
